<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Учёба</title>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF2F1;--card:#fff;--ink:#12263A;--mut:#5B6B79;--acc:#1F6FEB;--bad:#C8412B;--ok:#2E8B57;--line:#D5DEDC}
@media (prefers-color-scheme:dark){:root{--bg:#0F1A24;--card:#172635;--ink:#E6EEF3;--mut:#93A4B3;--acc:#5B9BFF;--bad:#FF7A63;--ok:#5CC48A;--line:#2A3D4F}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Onest,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{padding:16px 16px 0;max-width:760px;margin:auto}
h1{margin:0 0 12px;font-size:28px;font-weight:800;letter-spacing:-.02em}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
nav button{flex:none;border:1px solid var(--line);background:transparent;color:var(--mut);padding:8px 14px;border-radius:20px;font:inherit;cursor:pointer}
nav button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{max-width:760px;margin:auto;padding:8px 16px 48px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
textarea{width:100%;min-height:70px}
.grow{flex:1 1 140px}
button.b{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}
button.g{background:transparent;color:var(--mut);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.item{display:flex;gap:12px;align-items:flex-start}
.item .t{flex:1;min-width:0}
.chip{flex:none;min-width:44px;height:38px;padding:0 8px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:15px;background:var(--bg)}
.v5,.v4{color:var(--ok)}.v3{color:var(--acc)}.v2{color:var(--bad)}
.mut{color:var(--mut);font-size:14px}
.todo{color:var(--bad);font-size:14px}
.dsep{display:flex;align-items:baseline;gap:8px;margin:18px 0 2px;color:var(--mut);font-size:13px;font-weight:600}
.dsep:after{content:'';flex:1;align-self:center;height:1px;background:var(--line)}
.bar{height:8px;border-radius:4px;background:var(--line);margin:6px 0}
.bar i{display:block;height:100%;border-radius:4px;background:var(--bad)}
.bar i.v5,.bar i.v4{background:var(--ok)}.bar i.v3{background:var(--acc)}
.out{white-space:pre-wrap;background:var(--bg);border-radius:8px;padding:10px;margin-top:8px;font-size:15px}
.done{opacity:.55}
h2{font-size:18px;margin:18px 0 4px}
h3{font-size:16px}
@media print{header,nav,.noprint{display:none!important}body{background:#fff;color:#000}.box{border:0}}
</style></head><body>
<header><h1>Учёба</h1><nav id="nav"></nav></header>
<main id="app"></main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
let S=null;
try{S=JSON.parse(localStorage.getItem('uchyoba')||'null')}catch(e){}
S=S||{subjects:['Математика','Русский язык','Кыргыз тили','Английский язык','История','Физика','Биология','География','Информатика'].map(n=>({id:uid(),name:n})),grades:[],abs:[],topics:[]};
const save=()=>{try{localStorage.setItem('uchyoba',JSON.stringify(S))}catch(e){}};
const DEFMODS=[{n:1,from:'2026-09-21',to:'2026-10-04',max:15},{n:2,from:'2026-10-05',to:'2026-11-01',max:25},{n:3,from:'2026-11-02',to:'2026-11-29',max:25},{n:4,from:'2026-11-30',to:'2026-12-27',max:35}];
S.mods=S.mods||JSON.parse(JSON.stringify(DEFMODS));
let tab='grades',edit=null,ai={};
const fmt=n=>{n=Number(n);if(!Number.isFinite(n))return String(n);if(Number.isInteger(n))return String(n);const d=Math.abs(n)<10?2:1;return String(Math.round(n*10**d)/10**d)};
const gcls=g=>{if(!g.max)return 'v3';const r=g.v/g.max;return r>=.9?'v5':r>=.75?'v4':r>=.6?'v3':'v2'};
const modFor=d=>{if(!d)return 0;const m=S.mods.find(m=>d>=m.from&&d<=m.to);return m?m.n:0};
const modOf=g=>g.mod||modFor(g.date);
const LET=[[93,'A',4],[90,'A-',3.67],[87,'B+',3.33],[83,'B',3],[80,'B-',2.67],[77,'C+',2.33],[73,'C',2],[70,'C-',1.67],[67,'D+',1.33],[63,'D',1],[60,'D-',.67],[55,'E+',.5],[50,'E',.33],[45,'E-',.17],[0,'F',0]];
const letter=p=>LET.find(l=>p>=l[0]);
const safe=u=>/^https:\/\//.test(u||'')?u:'';
const tabs={grades:'Оценки',pts:'Баллы',abs:'Пропуски',topics:'Темы',kon:'Конспект',weak:'Слабые места',subj:'Предметы'};
const sn=id=>(S.subjects.find(s=>s.id===id)||{name:'?'}).name;
const opts=sel=>S.subjects.map(s=>`<option value="${s.id}"${s.id===sel?' selected':''}>${esc(s.name)}</option>`).join('');
const fd=d=>d?d.split('-').reverse().join('.'):'без даты';
const MON=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const plu=(n,a,b,c)=>{const m=n%10,h=n%100;return m===1&&h!==11?a:m>=2&&m<=4&&(h<10||h>=20)?b:c};
const dayTitle=d=>{
  if(!d)return 'без даты';
  const t=new Date(),td=t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');
  if(d===td)return 'сегодня';
  const y=new Date(Date.now()-864e5),yd=y.getFullYear()+'-'+String(y.getMonth()+1).padStart(2,'0')+'-'+String(y.getDate()).padStart(2,'0');
  if(d===yd)return 'вчера';
  const[Y,M,D]=d.split('-').map(Number);
  return `${D} ${MON[M-1]}${Y!==t.getFullYear()?' '+Y:''}`;
};
const age=d=>d?Math.floor((Date.now()-new Date(d))/864e5):null;
const byDate=(a,b)=>(a.date?0:1)-(b.date?0:1)||(b.date||'').localeCompare(a.date||'')||sn(a.sid).localeCompare(sn(b.sid),'ru');

function form(e){
  const g=tab==='grades',t=tab==='topics';
  return `<div class="box"><div class="row">
  <select id="f_s" class="grow">${opts(e.sid)}</select>
  ${g?`<input id="f_v" inputmode="decimal" placeholder="Баллов" style="width:92px" value="${e.v??''}"><input id="f_m" inputmode="decimal" placeholder="из" style="width:70px" value="${e.max??''}"><select id="f_o" aria-label="Модуль"><option value="0">Модуль: авто</option>${[1,2,3,4].map(n=>`<option value="${n}"${e.mod===n?' selected':''}>Модуль ${n}</option>`).join('')}</select>`:''}
  <input id="f_d" type="date" value="${esc(e.date)}" aria-label="Дата"></div>
  <div class="row" style="margin-top:8px">${t?`<textarea id="f_n" placeholder="Что прошли на уроке?">${esc(e.text)}</textarea>`
  :`<input id="f_n" class="grow" placeholder="${g?'За что оценка (можно позже)':'Причина (можно позже)'}" value="${esc(g?e.note:e.reason)}">`}
  <button class="b" data-a="add">${edit?'Сохранить':'Добавить'}</button>${edit?'<button class="g" data-a="cancel">Отмена</button>':''}</div></div>`;
}
function view(){
  if(tab==='pts')return ptsView();
  if(tab==='kon')return konView();
  if(tab==='subj')return subjView();
  if(tab==='weak')return weakView();
  const e=edit&&edit.tab===tab?S[tab].find(x=>x.id===edit.id)||{}:{};
  const list=[...S[tab]].sort(byDate);
  let h=(tab==='grades'?eduBox():'')+form(e)+(list.length?'':'<p class="mut">Пока пусто. Добавь первую запись выше.</p>');
  let lastD=null;
  for(const x of list){
    const btn=`<button class="g" data-a="edit" data-i="${x.id}">Изменить</button> <button class="g" data-a="del" data-i="${x.id}">Удалить</button>`;
    if(tab==='grades'){
      const d=x.date||'';
      if(d!==lastD){lastD=d;const cnt=list.filter(y=>(y.date||'')===d).length;
        h+=`<div class="dsep"><span>${dayTitle(d)}</span><span style="font-weight:400">${cnt} ${plu(cnt,'оценка','оценки','оценок')}</span></div>`}
      h+=`<div class="box item"><div class="chip ${gcls(x)}">${fmt(x.v)}${x.max?'/'+fmt(x.max):''}</div><div class="t"><b>${esc(sn(x.sid))}</b>${modOf(x)?` <span class="mut">· модуль ${modOf(x)}</span>`:''}<br>${x.note?esc(x.note):'<span class="todo">Допиши, за что оценка</span>'}<div style="margin-top:6px">${btn}</div></div></div>`;
    }
    if(tab==='abs')h+=`<div class="box item ${x.done?'done':''}"><div class="t"><b>${esc(sn(x.sid))}</b> <span class="mut">${fd(x.date)}</span><br>${x.reason?esc(x.reason):'<span class="mut">причина не указана</span>'}<div style="margin-top:6px"><button class="g" data-a="done" data-i="${x.id}">${x.done?'Вернуть в долги':'Тему нагнал'}</button> ${btn}</div></div></div>`;
    if(tab==='topics'){const a=age(x.rev),stale=a===null||a>14;
      h+=`<div class="box"><b>${esc(sn(x.sid))}</b> <span class="mut">${fd(x.date)}</span><div>${esc(x.text)}</div>
      <div class="${stale?'todo':'mut'}">${x.rev?'Повторял '+fd(x.rev):'Ещё не повторял'}</div>
      <div class="row" style="margin-top:8px"><button class="b" data-a="ai" data-k="note" data-i="${x.id}">Конспект</button><button class="b" data-a="ai" data-k="test" data-i="${x.id}">Тест</button><button class="b" data-a="ai" data-k="simple" data-i="${x.id}">Объясни проще</button><button class="g" data-a="rev" data-i="${x.id}">Повторил</button></div>
      ${ai[x.id]?`<div class="out">${esc(ai[x.id])}</div>`:''}<div style="margin-top:8px">${btn}</div></div>`}
  }
  return h;
}
function ptsView(){
  const rows=S.subjects.map(s=>{
    const gs=S.grades.filter(g=>g.sid===s.id&&g.max>0);
    if(!gs.length)return null;
    const ms=S.mods.map(m=>{
      const l=gs.filter(g=>modOf(g)===m.n).sort(byDate),e=l.reduce((a,g)=>a+g.v,0),x=l.reduce((a,g)=>a+g.max,0);
      return{m,l,e,x,left:Math.max(0,m.max-x)};
    });
    return{s,ms,E:ms.reduce((a,r)=>a+r.e,0),X:ms.reduce((a,r)=>a+r.x,0),L:ms.reduce((a,r)=>a+r.left,0),other:gs.filter(g=>!modOf(g)).length};
  }).filter(Boolean);
  if(!rows.length)return '<p class="mut">Баллов пока нет. Загрузи оценки из Edupage на вкладке «Оценки» или добавь вручную: баллы и «из скольки».</p>';
  const total=S.mods.reduce((a,m)=>a+m.max,0);
  const OE=rows.reduce((a,r)=>a+r.E,0),OX=rows.reduce((a,r)=>a+r.X,0),OL=rows.reduce((a,r)=>a+r.L,0);
  const op=OX?OE/OX*100:0,ol=letter(op);
  return `<div class="box"><b>Средний GPA по всем предметам</b>
  <div class="row" style="align-items:baseline;gap:10px;margin:4px 0"><span style="font-size:34px;font-weight:800">${ol[2].toFixed(2)}</span><span class="mut">буква ${ol[1]} · считаю как в школе: все набранные баллы ÷ все внесённые максимумы</span></div>
  <div class="bar"><i class="${gcls({v:OE,max:OX})}" style="width:${Math.round(op)}%"></i></div>
  <div style="margin:4px 0">Набрано <b>${fmt(OE)}</b> из ${fmt(OX)} внесённых (${Math.round(op)}%). Ещё можно получить <b>${fmt(OL)}</b>, тогда будет <b>${fmt(Math.min(OE+OL,total))}</b> из ${total} за семестр.</div></div>`+
  `<p class="mut">«Ещё можно» — сколько осталось до максимума модуля после уже внесённых работ.</p>`+rows.map(r=>{
    const pct=r.X?r.E/r.X*100:0,l=letter(pct);
    return `<div class="box"><b>${esc(r.s.name)}</b>
    <div class="row" style="align-items:baseline;gap:10px;margin:4px 0"><span style="font-size:22px;font-weight:800">${l[2].toFixed(2)}</span><span class="mut">GPA · буква ${l[1]}</span></div>
    <div class="bar"><i class="${gcls({v:r.E,max:r.X})}" style="width:${Math.round(pct)}%"></i></div>
    <div style="margin:4px 0">Набрано <b>${fmt(r.E)}</b> из ${fmt(r.X)} внесённых (${Math.round(pct)}%). Ещё можно получить: <b>${fmt(Math.min(r.E+r.L,total))}</b> из ${total}</div>
    ${r.ms.map(m=>`<details style="margin-top:6px"><summary><b>Модуль ${m.m.n}</b>: ${fmt(m.e)} из ${fmt(m.x)} <span class="mut">· ещё можно ${fmt(m.left)} из ${m.m.max}</span></summary>${m.l.map(g=>`<div class="mut" style="padding:2px 0 0 12px">${esc(g.note||'без названия')}: <b class="${gcls(g)}">${fmt(g.v)} из ${fmt(g.max)}</b> · ${fd(g.date)}</div>`).join('')||'<div class="mut" style="padding-left:12px">нет оценок</div>'}</details>`).join('')}
    ${r.other?`<div class="todo" style="margin-top:6px">Без модуля: ${r.other}. Укажи дату или модуль в оценке.</div>`:''}</div>`;
  }).join('');
}
function weakView(){
  const rows=S.subjects.map(s=>{
    const gs=S.grades.filter(g=>g.sid===s.id&&g.max>0),E=gs.reduce((a,g)=>a+g.v,0),X=gs.reduce((a,g)=>a+g.max,0),pct=X?E/X*100:null;
    const low=gs.filter(g=>g.v/g.max<.6).length,ab=S.abs.filter(a=>a.sid===s.id&&!a.done).length;
    const st=S.topics.filter(t=>t.sid===s.id&&(age(t.rev)===null||age(t.rev)>14)).length;
    const score=(pct!==null&&pct<90?(90-pct)/10:0)+low+ab*1.5+st*.5,why=[];
    if(pct!==null&&pct<90)why.push('набрано '+Math.round(pct)+'% от внесённых баллов');
    if(low)why.push('работ ниже 60%: '+low);
    if(ab)why.push('не нагнано пропусков: '+ab);
    if(st)why.push('давно не повторял тем: '+st);
    return{s,score,why};
  }).filter(r=>r.score>0).sort((a,b)=>b.score-a.score);
  if(!rows.length)return '<p class="mut">Слабых мест пока нет. Добавь оценки, пропуски и темы, и здесь появятся подсказки.</p>';
  const max=rows[0].score;
  return rows.map(r=>`<div class="box"><b>${esc(r.s.name)}</b><div class="bar"><i style="width:${Math.round(r.score/max*100)}%"></i></div><div class="mut">${r.why.join(' · ')}</div></div>`).join('');
}
function konView(){
  const n=ai.kon;
  let h=`<div class="box noprint"><div class="row"><select id="k_s" class="grow">${opts()}</select><input id="k_f" type="file" accept="image/*" multiple class="grow"></div><div class="row" style="margin-top:8px"><button class="b" data-a="konrun">Сделать конспект</button><span id="kmsg" class="mut"></span></div><div class="mut" style="margin-top:6px">До 4 фото: тетрадь, доска или учебник. Картинки берутся из Wikimedia Commons, автор и лицензия подписываются.</div></div>`;
  if(n)h+=`<div id="kon" class="box"><h2 style="margin-top:0">${esc(n.title)}</h2>`+(n.sections||[]).map(s=>`<h3 style="margin:16px 0 4px">${esc(s.h)}</h3><ul>${(s.points||[]).map(p=>`<li>${esc(p)}</li>`).join('')}</ul>${s.image&&safe(s.image.url)?`<figure style="margin:8px 0"><img src="${esc(safe(s.image.url))}" alt="" style="max-width:100%;border-radius:8px"><figcaption class="mut">${esc(s.image.author)} · ${esc(s.image.license)} · <a href="${esc(safe(s.image.page))}" target="_blank" rel="noopener">источник</a></figcaption></figure>`:''}`).join('')+
    ((n.terms||[]).length?`<h3>Термины</h3>`+n.terms.map(t=>`<p style="margin:4px 0"><b>${esc(t.w)}</b>: ${esc(t.d)}</p>`).join(''):'')+
    ((n.check||[]).length?`<h3>Проверь себя</h3><ol>${n.check.map(q=>`<li>${esc(q)}</li>`).join('')}</ol>`:'')+
    `</div><div class="row noprint"><button class="b" data-a="konsave">Сохранить в темы</button><button class="g" data-a="konprint">Скачать PDF</button></div>`;
  return h;
}
const shrink=f=>new Promise((ok,no)=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const k=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.8))};im.onerror=()=>no(new Error('фото не открылось'));im.src=u});
async function konRun(){
  const msg=t=>{const m=$('#kmsg');if(m)m.textContent=t};
  const files=[...($('#k_f').files||[])].slice(0,4);
  if(!files.length){msg('Выбери фото');return}
  const sid=$('#k_s').value;msg('Читаю фото и составляю конспект, это до минуты…');
  try{
    const images=await Promise.all(files.map(shrink));
    const call=()=>fetch('/api/photo',{method:'POST',headers:{'Content-Type':'application/json','x-pass':localStorage.getItem('uchyoba_pass')||''},body:JSON.stringify({images,subject:sn(sid)})});
    let r=await call();
    if(r.status===401){const p=prompt('Пароль приложения');if(p){localStorage.setItem('uchyoba_pass',p);r=await call()}}
    const d=await r.json();
    if(!r.ok){msg('Ошибка: '+(d.error||r.status));return}
    ai.kon=d.note;ai.konSid=sid;render();
  }catch(e){msg('Не получилось: '+e.message)}
}
const modsHtml=()=>`<h2>Модули семестра</h2>`+S.mods.map((m,i)=>`<div class="box row"><b>Модуль ${m.n}</b><input type="date" data-m="${i}" data-k="from" value="${esc(m.from)}"><input type="date" data-m="${i}" data-k="to" value="${esc(m.to)}"><span class="mut">всего ${m.max} баллов</span></div>`).join('');
function subjView(){
  return `<div class="box row"><input id="ns" class="grow" placeholder="Новый предмет"><button class="b" data-a="addsubj">Добавить</button></div>`+
  S.subjects.map(s=>`<div class="box row"><span class="grow">${esc(s.name)}</span><button class="g" data-a="rs" data-i="${s.id}">Удалить</button></div>`).join('')+
  modsHtml()+`<h2>Резервная копия</h2><div class="row"><button class="g" data-a="exp">Скачать данные</button><button class="g" data-a="imp">Загрузить данные</button></div><input id="file" type="file" accept=".json" hidden>`;
}
function render(){
  S.mods=S.mods||JSON.parse(JSON.stringify(DEFMODS));
  $('#nav').innerHTML=Object.entries(tabs).map(([k,v])=>`<button class="${k===tab?'on':''}" data-a="tab" data-i="${k}">${v}</button>`).join('');
  $('#app').innerHTML=view();
  const f=$('#file');if(f)f.onchange=()=>{const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d.subjects&&d.grades){S=d;save();render()}}catch(e){alert('Файл не подходит')}};r.readAsText(f.files[0])};
}
async function ask(k,id){
  const t=S.topics.find(x=>x.id===id);ai[id]='Думаю…';render();
  const call=async()=>fetch('/api/ai',{method:'POST',headers:{'Content-Type':'application/json','x-pass':localStorage.getItem('uchyoba_pass')||''},body:JSON.stringify({task:k,subject:sn(t.sid),text:t.text})});
  try{
    let r=await call();
    if(r.status===401){const p=prompt('Пароль приложения');if(p){localStorage.setItem('uchyoba_pass',p);r=await call()}}
    const d=await r.json();ai[id]=r.ok?d.text:'Ошибка: '+(d.error||r.status);
  }catch(e){ai[id]='Нет связи с сервером. Работает ли /api/ai?'}
  render();
}
function eduBox(){
  let sv={};try{sv=JSON.parse(localStorage.getItem('uchyoba_edu')||'{}')}catch(e){}
  return `<div class="box"><b>Импорт из Edupage</b>
  <div class="row" style="margin-top:8px"><input id="e_s" class="grow" placeholder="Школа (до .edupage.org)" value="${esc(sv.school)}" autocapitalize="off">
  <input id="e_u" class="grow" placeholder="Логин" value="${esc(sv.user)}" autocapitalize="off">
  <input id="e_p" class="grow" type="password" placeholder="Пароль" autocomplete="current-password"></div>
  <div class="row" style="margin-top:8px"><button class="b" data-a="edu">Загрузить оценки</button><span id="imsg" class="mut"></span></div>
  <div class="mut" style="margin-top:6px">Пароль нигде не сохраняется, он нужен только на время загрузки. Школа и логин запоминаются в этом браузере.</div></div>`;
}
async function importEdu(){
  const msg=t=>{const m=$('#imsg');if(m)m.textContent=t};
  const school=($('#e_s')||{}).value.trim(),user=($('#e_u')||{}).value.trim(),pass=($('#e_p')||{}).value;
  if(!school||!user||!pass){msg('Заполни школу, логин и пароль');return}
  try{localStorage.setItem('uchyoba_edu',JSON.stringify({school,user}))}catch(e){}
  msg('Загружаю…');
  const call=()=>fetch('/api/edupage',{method:'POST',headers:{'Content-Type':'application/json','x-pass':localStorage.getItem('uchyoba_pass')||''},body:JSON.stringify({school,user,pass})});
  try{
    let r=await call();
    if(r.status===401){const p=prompt('Пароль приложения');if(p){localStorage.setItem('uchyoba_pass',p);r=await call()}}
    const d=await r.json();
    if(!r.ok){msg('Ошибка: '+(d.error||r.status));return}
    let add=0,upd=0,skip=0;const seen=new Set();
    for(const g of d.grades){
      const v=parseFloat(g.v);
      if(isNaN(v)){skip++;continue}
      let s=S.subjects.find(x=>x.name.toLowerCase()===(g.subject||'').toLowerCase());
      if(!s){s={id:uid(),name:g.subject||'Без названия'};S.subjects.push(s)}
      const key=g.eid||[g.subject,g.date,v,g.note].join('|');
      const ex=S.grades.find(x=>x.eid===key);
      if(ex){
        // Оценка уже импортирована: Edupage — источник истины, обновляем значение,
        // максимум и дату (учитель мог их изменить). Своё: модуль и заметка.
        const was=ex.v+'/'+ex.max+' '+ex.date;
        ex.v=v;
        if(g.max!=null)ex.max=g.max;
        if(g.date)ex.date=g.date;
        ex.mod=ex.mod||g.mod||0;
        if(!ex.note&&g.note)ex.note=g.note;
        const now=ex.v+'/'+ex.max+' '+ex.date;
        if(was!==now)upd++;
        seen.add(key);continue
      }
      const same=S.grades.find(x=>!x.eid&&x.sid===s.id&&x.date===g.date&&x.v===v);
      if(same){same.eid=key;same.max=same.max||g.max||null;same.mod=same.mod||g.mod||0;if(!same.note)same.note=g.note;seen.add(key);continue}
      S.grades.push({id:uid(),sid:s.id,v,max:g.max||null,mod:g.mod||0,date:g.date,note:g.note,eid:key});add++;
      seen.add(key);
    }
    save();render();
    const sk=d.skip||{},parts=[];
    if(upd)parts.push('обновлено: '+upd);
    if(skip)parts.push('нечисловых: '+skip);
    if(sk.no_subject)parts.push('без предмета: '+sk.no_subject);
    if(sk.no_data)parts.push('пустых: '+sk.no_data);
    if(sk.bad)parts.push('ошибок чтения: '+sk.bad);
    const gone=S.grades.filter(x=>x.eid&&!seen.has(x.eid)).length;
    if(gone)parts.push('не найдено в Edupage (возможно, удалены там): '+gone);
    msg(`Добавлено: ${add}`+(parts.length?' · '+parts.join(' · '):''));
  }catch(e){msg('Нет связи с /api/edupage')}
}
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,i=b.dataset.i,val=id=>($('#'+id)||{}).value||'';
  if(a==='tab'){tab=i;edit=null}
  else if(a==='cancel')edit=null;
  else if(a==='add'){
    let o={sid:val('f_s'),date:val('f_d')};const n=val('f_n').trim();
    if(tab==='grades'){o.v=parseFloat(val('f_v').replace(',','.'));if(isNaN(o.v)){alert('Впиши, сколько баллов набрано (например 12 или 12,5)');return}o.max=parseFloat(val('f_m').replace(',','.'))||null;o.mod=+val('f_o')||0;o.note=n}
    if(tab==='abs')o.reason=n;
    if(tab==='topics'){if(!n)return;o.text=n}
    if(edit){Object.assign(S[tab].find(x=>x.id===edit.id),o);edit=null}
    else S[tab].push({id:uid(),done:false,rev:'',...o});
    save();
  }
  else if(a==='edit')edit={tab,id:i};
  else if(a==='del'){if(confirm('Удалить запись?')){S[tab]=S[tab].filter(x=>x.id!==i);save()}}
  else if(a==='done'){const x=S.abs.find(x=>x.id===i);x.done=!x.done;save()}
  else if(a==='rev'){S.topics.find(x=>x.id===i).rev=new Date().toISOString().slice(0,10);save()}
  else if(a==='ai'){ask(b.dataset.k,i);return}
  else if(a==='edu'){importEdu();return}
  else if(a==='konrun'){konRun();return}
  else if(a==='konprint'){window.print();return}
  else if(a==='konsave'){const n=ai.kon;if(!n)return;S.topics.push({id:uid(),sid:ai.konSid||S.subjects[0].id,date:new Date().toISOString().slice(0,10),text:n.title+': '+(n.sections||[]).map(x=>x.h).join('; '),rev:''});save();tab='topics'}
  else if(a==='addsubj'){const n=val('ns').trim();if(n){S.subjects.push({id:uid(),name:n});save()}}
  else if(a==='rs'){if(confirm('Удалить предмет? Записи по нему останутся без названия.')){S.subjects=S.subjects.filter(x=>x.id!==i);save()}}
  else if(a==='exp'){const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));l.download='uchyoba-backup.json';l.click()}
  else if(a==='imp'){$('#file').click();return}
  render();
});
document.addEventListener('change',ev=>{const t=ev.target;if(t.dataset&&t.dataset.m!==undefined){S.mods[+t.dataset.m][t.dataset.k]=t.value;save()}});
render();
